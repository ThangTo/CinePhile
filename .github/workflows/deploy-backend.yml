name: Deploy Backend API to VPS

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/**' # Thêm dòng này để khi cấu hình file YAML nó cũng tự trigger
  workflow_dispatch: # Bắt buộc nên có để hiện nút "Run workflow" chạy thủ công trên Github

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 15m
          script: |
            set -eu

            APP_DIR=/opt/cinephine
            test -d "$APP_DIR/.git"

            cd "$APP_DIR"
            git fetch --prune origin dev
            git checkout -B dev origin/dev
            git reset --hard origin/dev

            cd backend
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js --env production --update-env
            pm2 save

            curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:5000/health
