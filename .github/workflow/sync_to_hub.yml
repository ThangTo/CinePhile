name: Sync Backend to Hugging Face
on:
  push:
    branches: [dev]
    paths:
      - 'backend/**' # Chỉ chạy khi sửa backend

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend folder to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ThangTo
          HF_SPACE_NAME: CinePhine
        run: |
          # Lệnh này sẽ bóc tách thư mục 'backend' và đẩy nó thành root bên HF
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME `git subtree split --prefix backend main`:main --force
