version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinephine-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TIKTOK_ENABLED=${TIKTOK_ENABLED:-true}
      - TIKTOK_WORKER_URL=${TIKTOK_WORKER_URL:-http://tiktok-worker:8787}
      - TIKTOK_FETCH_TIMEOUT_MS=${TIKTOK_FETCH_TIMEOUT_MS:-30000}
      - TIKTOK_FETCH_RETRIES=${TIKTOK_FETCH_RETRIES:-2}
      - TIKTOK_TMDB_SEARCH_LIMIT=${TIKTOK_TMDB_SEARCH_LIMIT:-10}
      - TRENDING_AUTO_CRAWL_LIMIT=${TRENDING_AUTO_CRAWL_LIMIT:-6}
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - cinephine-network
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:5000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: cinephine-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=cinephine
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cinephine-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cinephine-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - cinephine-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted Whisper (Speech-to-Text)
  # OpenAI-compatible API at http://localhost:8000/v1/audio/transcriptions
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: cinephine-whisper
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
      - WHISPER__INFERENCE_DEVICE=cpu
    volumes:
      - whisper_cache:/root/.cache
    networks:
      - cinephine-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  tiktok-worker:
    build:
      context: ./tiktok_worker
      dockerfile: Dockerfile
    container_name: cinephine-tiktok-worker
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      - TIKTOK_MS_TOKEN=${TIKTOK_MS_TOKEN}
      - TIKTOK_PROXY_URL=${TIKTOK_PROXY_URL}
      - TIKTOK_TRENDING_COUNT=${TIKTOK_TRENDING_COUNT:-30}
      - TIKTOK_BROWSER=${TIKTOK_BROWSER:-chromium}
      - TIKTOK_WORKER_HOST=0.0.0.0
      - TIKTOK_WORKER_PORT=8787
    networks:
      - cinephine-network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  cinephine-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  whisper_cache:
    driver: local
